# Project-wide tunables. Read by app.config.

# Transcript ingestion (Phase 1b polish — see ADR 0004)
transcript:
  # Seconds to wait between consecutive video metadata + transcript fetches.
  # Reduces YouTube rate-limit / IP-block risk. Add small jitter on top.
  fetch_delay_seconds: 2.5
  fetch_jitter_seconds: 1.0

  # Whisper fallback when youtube-transcript-api fails (IpBlocked, missing).
  # Backends: 'none' (skip), 'faster_whisper' (local), 'openai_api' (cloud).
  # 'faster_whisper' requires `pip install -e ".[whisper]"` and ffmpeg on PATH.
  whisper_backend: faster_whisper
  whisper_model: base.en        # tiny.en | base.en | small.en | medium.en
  whisper_device: cpu           # cpu | cuda
  whisper_compute_type: int8    # int8 (fast on cpu) | float16 | float32
  audio_cache_dir: data/cache/audio

# Backtest assumptions
backtest:
  primary_horizon: 5d
  horizons: [1d, 3d, 5d, 21d]
  round_trip_cost_bps: 10
  trigger_window_days: 10        # how long after posted_at a trigger can fire
  market_calendar: XNYS

# Extraction
extraction:
  min_final_confidence: 0.5
  llm_context_seconds_before: 90
  llm_context_seconds_after: 90
  extractor_version: "v0.1"

# Universe
universe:
  ticker_csv_path: configs/universe.csv
  enforce_membership: true

# Scoring windows
scoring:
  windows: [all, 365d, 90d]
  min_n_for_scoring: 5

# Walk-forward backtests (ADR 0007).
#
# t2_cutoff is the *final test-set boundary* — out-of-sample data after this
# date is held back for honest evaluation only. The harness REFUSES to evaluate
# a strategy whose `version` has been changed without bumping the version,
# which forces a fresh test run.
#
# Bumping t2_cutoff is a deliberate act: it should only move forward when
# enough new history has accumulated to justify a new evaluation cohort.
# Document any bump in an ADR so future-you can see why.
walkforward:
  t2_cutoff: "2026-01-01T00:00:00+00:00"  # UTC — out-of-sample begins here
  min_n_trades: 30                         # below this, results render as "underpowered"
  default_rebalance: weekly                # daily | weekly | on_signal
  cost_bps_grid: [5, 10, 25, 50]           # stress-test set; 10 is the headline
  benchmark_ticker: SPY

# Entry/exit research feature (Quick + Deep modes).
research:
  deep:
    # Round-2 cross-lens debate after the 4 analysts post round-1.
    # ON by default since 2026-08 (cost +~$0.02/run, +~10s per Deep run).
    cross_lens_round: true
    # Sentiment-Macro lens may issue web searches (+~$0.01/search).
    sentiment_web_search: true
    sentiment_web_search_max_uses: 1
