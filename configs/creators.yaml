# Tracked creators for ingestion. Phase 1: YouTube only.
#
# `external_id` for YouTube can be either a UC... channel ID or a @handle.
# yt-dlp resolves both. UC... is more stable across rebrands, so we'll
# upgrade these to UC IDs after the first successful ingest run resolves them.
#
# `notes` is for project-internal context only. It is not used by the pipeline
# beyond being persisted on the Creator row.
#
# Curation criteria (see docs/architecture.md):
#   - Issues *specific* swing-trade calls (ticker + direction + ideally a level).
#   - Regular cadence (≥ weekly).
#   - English transcripts available.
#   - Independent voice; not a CNBC-style aggregator.

creators:
  - display_name: "Adam Mancini"
    source_type: youtube
    external_id: "@AdamMancini4"
    handle: "@AdamMancini4"
    url: "https://www.youtube.com/@AdamMancini4"
    active: true
    notes: |
      Daily SPX/ES levels-based plan plus 2–7 day ETF swing trades. Highly falsifiable
      by design (recapture / failed-breakdown triggers, explicit invalidation). Most
      detailed plans are on Substack/X — YouTube content captures the headline calls.

  - display_name: "The Trade Risk"
    source_type: youtube
    external_id: "@traderisk"
    handle: "@traderisk"
    url: "https://www.youtube.com/@traderisk"
    active: true
    notes: |
      Weekly "Stock Market Weekly" plus rules-based swing system. Curated TR150
      watchlist with named leadership stocks. Some specific signals are paywalled;
      YouTube content skews to weekly recap.

  - display_name: "TraderLion"
    source_type: youtube
    external_id: "@TraderLion"
    handle: "@TraderLion"
    url: "https://www.youtube.com/@TraderLion"
    active: true
    notes: |
      Growth/momentum hub featuring multiple traders (Oliver Kell, Leif Soreide,
      Anthony Shi). "Stocks in focus" / setups-of-the-week with named tickers and
      pivot levels in the Minervini/Qullamaggie tradition.

  - display_name: "Alphatrends"
    source_type: youtube
    external_id: "@alphatrends"
    handle: "@alphatrends"
    url: "https://www.youtube.com/@alphatrends"
    active: true
    notes: |
      Brian Shannon — daily end-of-day technical recap + VWAP-based swing setups.
      30+ year track record. Calls are often conditional ("if it holds X") so the
      extractor must handle trigger semantics carefully.

  - display_name: "Patrick Walker (Mission Winners)"
    source_type: youtube
    external_id: "@PatrickWalker56"
    handle: "@PatrickWalker56"
    url: "https://www.youtube.com/@PatrickWalker56"
    active: false
    notes: |
      Long-tenured swing trader; price/volume breakouts on individual stocks.
      DISABLED: handle returned 404 on first ingest. Verify the correct
      @handle / channel ID and re-enable. Candidate for a manual lookup —
      he often guests on @traderisk.

  - display_name: "Bulls on Wall Street"
    source_type: youtube
    external_id: "@kunaldesaitrading"
    handle: "@kunaldesaitrading"
    url: "https://www.youtube.com/@kunaldesaitrading"
    active: true
    notes: |
      Kunal Desai. Daily watchlists / game plans, mix of day + swing.
      Promotional bias (sells a bootcamp). Filter day-trade calls out via timeframe
      tagging in extraction.

  - display_name: "Qullamaggie"
    source_type: youtube
    external_id: "@Qullamaggie"
    handle: "@Qullamaggie"
    url: "https://www.youtube.com/@Qullamaggie"
    active: true
    notes: |
      Kristjan Kullamägi. Episodic-pivot and breakout swing trading on momentum
      leaders. Cadence is irregular; sample size will be smaller than peers — useful
      as a sanity check on momentum-style scoring.

  - display_name: "Oliver Velez Trading"
    source_type: youtube
    external_id: "@OliverVelezTrading"
    handle: "@OliverVelezTrading"
    url: "https://www.youtube.com/@OliverVelezTrading"
    active: true
    notes: |
      Pristine method, explicit entry/stop/target rules on named large-caps.
      Heavy course/membership promo; testimonial-heavy videos should be filtered
      via title heuristics during ingestion.

  # ----- Phase 6 expansion: 7 additional creators added 2026-05-03 -----
  # Resolved each handle via YouTube Data API; using UC IDs for stability.

  - display_name: "Stock Market Mentor"
    source_type: youtube
    external_id: "UCkvnZJf08NVB6CaV4Ys-YPg"
    handle: "@StockMarketMentor"
    url: "https://www.youtube.com/@StockMarketMentor"
    active: true
    notes: |
      Dan Fitzpatrick. Long-form Strategy Sessions Mon-Thu plus a Weekend
      Update. Specific entries / stops / partials documented. CNBC regular,
      so some content leans commentary; deeper alerts are paywalled.

  - display_name: "Stockbee"
    source_type: youtube
    external_id: "UCokSy9UkcPDCYyrU5_6835w"
    handle: "@stockbee"
    url: "https://www.youtube.com/@stockbee"
    active: false   # 2026-05-07: channel_id above resolves to a Vietnamese
                    # livestream channel, NOT Pradeep Bonde. Three docs ingested
                    # (Vietnamese livestreams about TTCK Việt Nam) — extraction
                    # produces 0 calls because the language isn't English, so
                    # they're inert noise in the corpus. Find the correct
                    # Pradeep Bonde channel ID and reactivate.
    notes: |
      Pradeep Bonde. Momentum-burst swing setups (3-5 day holds, 8-20% targets).
      Channel cadence is sporadic — strongest content is on his blog. Useful
      as a low-volume but focused signal source.

  - display_name: "Richard Moglen"
    source_type: youtube
    external_id: "UCYqMAKiU3tFijWnyqAxG4Cg"
    handle: "@RichardMoglen"
    url: "https://www.youtube.com/@RichardMoglen"
    active: true
    notes: |
      Weekly Stock Market Outlook + interviews with growth/momentum traders.
      Tied to the TraderLion ecosystem. Filter for the "Outlook" series — the
      interview episodes are educational rather than directional.

  - display_name: "ShadowTrader"
    source_type: youtube
    external_id: "UCV00elXN8Z0vrFIAZu3rIKw"
    handle: "@ShadowTrader"
    url: "https://www.youtube.com/channel/UCV00elXN8Z0vrFIAZu3rIKw"
    active: true
    notes: |
      Peter Reznicek. Weekend Edition reviews indices and sectors and previews
      next-week trade ideas. Often index/sector level rather than single-name —
      verify ticker density per video before scoring heavily.

  - display_name: "Leavitt Brothers"
    source_type: youtube
    external_id: "UCFDNcstsXmh6YMihMuRYZVA"
    handle: "@leavittbrothers"
    url: "https://www.youtube.com/@leavittbrothers"
    active: true
    notes: |
      Jason Leavitt. Trend-following equity swing trading, multi-day to
      multi-week holds. State of the Market + Trading Ideas updates. Free
      cadence is irregular; deeper service is paid.

  - display_name: "IBD Videos"
    source_type: youtube
    external_id: "UC2w7fC_pE5n6-rlUko9TotA"
    handle: "@IBDvideos"
    url: "https://www.youtube.com/@IBDvideos"
    active: true
    notes: |
      Investor's Business Daily. CAN SLIM growth-stock swing/position trading
      with named pivot points and buy zones. Multi-host (David Ryan, Roppel,
      Minervini guests) — call attribution is messier than single-creator
      channels. Highest signal density of any institutional source.

  - display_name: "T3 Live"
    source_type: youtube
    external_id: "UCBj1BiYgmUJWdzqLhfInpJg"
    handle: "@t3live"
    url: "https://www.youtube.com/@t3live"
    active: true
    notes: |
      Scott Redler's Morning Call + Sami Abusaad's Strategic Swing Trader.
      Daily morning videos are short (~3-8 min) — borderline for our segment
      threshold; weekly Sami previews are the higher-value content.

# Deliberately excluded after research:
#   - StockChartsTV sub-shows (MEM Edge, Bowley): require per-video title routing
#     to attribute to a specific creator; revisit in Phase 1b.
#   - Harry Boxer / The Tech Trader: handle wouldn't resolve via Data API;
#     find the correct @handle / channel ID and reconsider.
#   - Investors Underground / Mish: heavily paywalled or promo-skewed.
#   - Anne-Marie Baiynd: mixed equities + options, complicates evaluation.
#   - Jim Roppel: monthly cadence too low; covered indirectly via IBD Videos.
#   - ZipTrader, Ricky Gutierrez, Stock Moe, Joseph Carlson, Tim Sykes:
#     fail "issues specific falsifiable swing-trade calls" criterion.
